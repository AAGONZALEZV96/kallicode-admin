name: kallicode-admin

# Las puertas de integración continua de la consola. El orden importa: lo barato y
# lo que falla más a menudo, primero, para que un error de estilo no espere a que
# arranque un PostgreSQL.
#
# La puerta que no se puede saltar con una excepción es `no-fuga`: valida que el rol
# de lectura de la consola no alcanza más columnas que las del inventario aprobado.
# Es la única garantía técnica de que la excepción al aislamiento por inquilino
# sigue acotada, así que se ejecuta aparte y con nombre propio para que quede claro
# en el listado de comprobaciones qué es lo que ha fallado.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  estatico:
    name: Estilo y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: black
        run: black --check .
      - name: mypy
        run: mypy apps/api/src apps/workers/src

  unitarias:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest sin base de datos
        run: pytest -m "not integracion" --cov-fail-under=0 -q

  integracion:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kallicode_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # La suite reutiliza esta base en lugar de levantar un contenedor propio.
      KC_ADMIN_TEST_DSN: postgresql://postgres:postgres@localhost:5432/kallicode_test
      KC_ADMIN_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - name: Traer el esquema de la plataforma
        uses: actions/checkout@v4
        with:
          repository: kallicode/kallicode-backend
          path: kallicode-backend
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -e ".[dev]"
      - name: pytest con base de datos
        run: pytest --cov-report=xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: coverage.xml

  no-fuga:
    name: No-fuga del rol de lectura
    runs-on: ubuntu-latest
    needs: integracion
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kallicode_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      KC_ADMIN_TEST_DSN: postgresql://postgres:postgres@localhost:5432/kallicode_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kallicode/kallicode-backend
          path: kallicode-backend
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -e ".[dev]"
      - name: Inventario de acceso y privilegios reales
        run: pytest tests/test_no_leak.py -v --cov-fail-under=0
      - name: Validación empaquetada en la base
        run: |
          psql "$KC_ADMIN_TEST_DSN" -v ON_ERROR_STOP=1 \
            -c "SELECT * FROM admin.validate_read_role()"

  autorizacion:
    name: Matriz de autorización
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # No necesita base de datos: la identidad se sustituye por una fija. Corre
      # en cada empujón y en menos de un minuto, que es lo que hace que nadie la
      # desactive.
      - name: 31 endpoints × 4 roles
        run: pytest tests/test_authorization_matrix.py -m "not integracion" -v --cov-fail-under=0
