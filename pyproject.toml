[project]
name = "kallicode-admin"
version = "0.1.0"
description = "Consola de Administración de KalliCode: API /admin/v1 e interfaz interna"
requires-python = ">=3.12"

# Dependencias declaradas de forma explícita y con cota superior. El defecto
# BE-F07 del backend fue declarar `dependencies = []` mientras el paquete
# importaba ocho librerías; aquí no se repite.
dependencies = [
    "kallicode-core>=0.1.0,<0.2.0",     # config, log central, errores, sesiones, seguridad, auditoría
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.32,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "redis>=5.2,<6",
    "pyjwt[crypto]>=2.10,<3",
    "argon2-cffi>=23.1,<24",
    "pyotp>=2.9,<3",                    # TOTP del segundo factor (§18.2, §18.3)
    "qrcode[pil]>=8.0,<9",              # URL otpauth y QR de inscripción (§18.3)
    "httpx>=0.28,<0.29",                # consumo del contrato de telemetría (§17.14-17.16)
    "azure-storage-blob>=12.24,<13",    # informes exportables (§18.22, §18.23)
    "azure-identity>=1.19,<2",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.26",
    "pytest-cov>=6.0,<7",
    "httpx>=0.28,<0.29",
    "testcontainers[postgres]>=4.8,<5",
    "respx>=0.22,<0.23",                # dobles del contrato de telemetría
    "schemathesis>=4.0,<5",             # pruebas de contrato y fuzzing OpenAPI v1.0
    "freezegun>=1.5,<2",                # caducidad de concesiones y relojes de SLA
    "ruff>=0.8,<0.13",
    "black>=24.10,<26",
    "mypy>=1.13,<2",
]
[tool.uv.sources]
kallicode-core = { path = "../kallicode-backend/packages/core", editable = true }
kallicode-admin-api = { workspace = true }
kallicode-admin-workers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/admin_api", "apps/workers/src/admin_workers"]

# ---------------------------------------------------------------------------
# Calidad. El umbral de cobertura se aplica desde el primer sprint y no como
# objetivo creciente: un repositorio nuevo que nace sin pruebas repetiría el
# error que la auditoría encontró en los otros cinco subproyectos.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=admin_api --cov=admin_workers --cov-report=term-missing --cov-fail-under=80 --strict-markers"
markers = [
    # Exige un PostgreSQL 16 real. Se omite si no hay contenedor ni KC_ADMIN_TEST_DSN.
    # `pytest -m "not integracion"` da la vuelta rápida durante el desarrollo.
    "integracion: exige base de datos real",
]
filterwarnings = ["error::DeprecationWarning:admin_api.*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.12"
# Desactivamos el modo estricto global temporalmente para absorber el scaffold
strict = false
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = false
warn_unreachable = true
plugins = ["pydantic.mypy"]

# TODO: Remover overrides de kallicode_core.* cuando el Equipo 3 entregue KC-BE-11-3 en el Sprint 11.
[[tool.mypy.overrides]]
# Ignoramos la falta de py.typed en el núcleo y librerías de terceros
module = [
    "pyotp.*", 
    "qrcode.*", 
    "testcontainers.*", 
    "kallicode_core.*", 
    "redis.*", 
    "azure.*"
]
ignore_missing_imports = true

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]
# Relajamos reglas específicas de seguridad estática (Bandit) que chocan con la base actual
ignore = [
    "RUF001", "RUF002", "RUF003", 
    "S101", # Permite asserts para type narrowing
    "S608", # Permite f-strings en SQL (seguridad manejada por los helpers)
    "S110", # Permite try-except-pass (usado en el worker)
    "S603", "S607", # Permite subprocess con strings en conftest.py
    "SIM102", "SIM105", "SIM117", # Simplificaciones de bloques anidados
    "UP046" # Sintaxis de genéricos previa a Python 3.12
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.black]
line-length = 96
target-version = ["py312"]
