openapi: 3.0.3
info:
  title: KalliCode · API de Administración
  description: Superficie interna de la consola de negocio y operaciones. No la consume ningún cliente ni ningún agente del
    pipeline. Documentada en el capítulo 18 del Diseño del backend.
  version: 1.0.0
paths:
  /admin/v1/health:
    get:
      tags:
      - Salud
      summary: Salud del servicio de administración
      description: Sonda de disponibilidad. 503 si una dependencia crítica no responde.
      operationId: health_admin_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Admin V1 Health Get
  /admin/v1/auth/login:
    post:
      tags:
      - Identidad y sesión
      summary: Iniciar sesión (primer factor)
      description: 'Verifica correo y contraseña y devuelve un desafío de segundo factor.


        No emite tokens: sin segundo factor verificado no hay sesión, y no existe

        forma de omitirlo para ningún rol.'
      operationId: login_admin_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/auth/mfa/verify:
    post:
      tags:
      - Identidad y sesión
      summary: Verificar segundo factor y emitir tokens
      description: Verifica el código TOTP o un código de recuperación y abre la sesión.
      operationId: mfa_verify_admin_v1_auth_mfa_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/auth/mfa/enroll:
    post:
      tags:
      - Identidad y sesión
      summary: Inscribir segundo factor (TOTP)
      description: 'Inscribe o reinscribe el segundo factor.


        Dos caminos: en el primer acceso, con el desafío de §18.1; y para reinscribir

        tras la pérdida del dispositivo, con la contraseña vigente. En ambos casos el

        secreto y los códigos de recuperación se muestran una única vez y no existe

        endpoint para volver a consultarlos.'
      operationId: mfa_enroll_admin_v1_auth_mfa_enroll_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/auth/refresh:
    post:
      tags:
      - Identidad y sesión
      summary: Renovar tokens
      description: 'Rotación de un solo uso, con comprobación de la caducidad por inactividad.


        Reutilizar un token ya consumido revoca todas las sesiones del empleado, igual

        que en el portal, y el rol se resuelve en base de datos: un cambio de rol o

        una desactivación invalidan la renovación de inmediato.'
      operationId: refresh_admin_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/auth/logout:
    post:
      tags:
      - Identidad y sesión
      summary: Cerrar sesión
      description: 'Revoca el refresh y añade el token de acceso a la lista de denegación.


        El cierre de sesión no revoca las concesiones de acceso vigentes: caducan por

        su propio vencimiento o se revocan expresamente (§18.15).'
      operationId: logout_admin_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/auth/forgot-password:
    post:
      tags:
      - Identidad y sesión
      summary: Solicitar restablecimiento de contraseña
      description: 'Envía el enlace de restablecimiento. Siempre 204, exista o no la cuenta.


        Restablecer la contraseña no reinscribe el segundo factor: el empleado sigue

        necesitando su autenticador.'
      operationId: forgot_password_admin_v1_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/auth/reset-password:
    post:
      tags:
      - Identidad y sesión
      summary: Restablecer contraseña
      description: Fija la contraseña nueva y revoca todas las sesiones del empleado.
      operationId: reset_password_admin_v1_auth_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/auth/invitations/accept:
    post:
      tags:
      - Identidad y sesión
      summary: Aceptar invitación (alta de personal)
      description: 'Completa el alta a partir de la invitación de §18.11.


        El rol y el correo se toman de la invitación y no del cuerpo de la petición:

        un invitado no puede elevarse el rol ni cambiar su correo al aceptar. Tras

        fijar la contraseña, el flujo continúa obligatoriamente por §18.3 y hasta

        completarlo no se emiten tokens.'
      operationId: accept_invitation_admin_v1_auth_invitations_accept_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/staff/me:
    get:
      tags:
      - Gestión del personal
      summary: Perfil del empleado autenticado
      description: 'Devuelve rol, permisos efectivos y concesiones vigentes.


        La consola lo consulta al arrancar para decidir qué pantallas muestra y qué

        datos puede pedir sin solicitar una concesión nueva. Los permisos se derivan

        del rol y no se almacenan, para que no puedan divergir de la matriz.'
      operationId: perfil_admin_v1_staff_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Perfil Admin V1 Staff Me Get
  /admin/v1/staff:
    get:
      tags:
      - Gestión del personal
      summary: Listar personal de KalliCode
      description: Listado con rol, estado, último acceso y segundo factor inscrito.
      operationId: listar_admin_v1_staff_get
      parameters:
      - name: rol
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtra por rol de staff.
          title: Rol
        description: Filtra por rol de staff.
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: invited | active | deactivated.
          title: Estado
        description: invited | active | deactivated.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Página, empezando en 1.
          default: 1
          title: Page
        description: Página, empezando en 1.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Tamaño de página, 1–100.
          default: 25
          title: Page Size
        description: Tamaño de página, 1–100.
      - name: sort
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Orden: campo-asc o campo-desc.'
          title: Sort
        description: 'Orden: campo-asc o campo-desc.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Listar Admin V1 Staff Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/staff/invitations:
    post:
      tags:
      - Gestión del personal
      summary: Invitar a un empleado
      description: Crea la invitación y envía el enlace al correo corporativo.
      operationId: invitar_admin_v1_staff_invitations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitarIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitarOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/staff/{staff_id}:
    patch:
      tags:
      - Gestión del personal
      summary: Actualizar rol o estado de un empleado
      description: Cambia el rol o desactiva. La desactivación corta el acceso de inmediato.
      operationId: actualizar_admin_v1_staff__staff_id__patch
      parameters:
      - name: staff_id
        in: path
        required: true
        schema:
          type: string
          description: Empleado a modificar.
          title: Staff Id
        description: Empleado a modificar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActualizarOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/access-grants:
    post:
      tags:
      - Concesiones de acceso
      summary: Solicitar acceso a los datos de un cliente
      description: 'Crea una concesión justificada y temporal.


        La concesión no amplía el rol: un empleado con rol de soporte no obtiene por

        esta vía acceso a los agregados globales de negocio.'
      operationId: crear_admin_v1_access_grants_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrearOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Concesiones de acceso
      summary: Listar concesiones de acceso
      description: 'Lista las concesiones. El ámbito `todas` exige rol de administración.


        Con otro rol se devuelve 403 y no un listado recortado, para que el

        comportamiento sea inequívoco.'
      operationId: listar_admin_v1_access_grants_get
      parameters:
      - name: ambito
        in: query
        required: false
        schema:
          type: string
          description: propias | todas.
          default: propias
          title: Ambito
        description: propias | todas.
      - name: tenant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: vigente | caducada | revocada.
          title: Estado
        description: vigente | caducada | revocada.
      - name: desde
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Desde
      - name: hasta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Hasta
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Página, empezando en 1.
          default: 1
          title: Page
        description: Página, empezando en 1.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Tamaño de página, 1–100.
          default: 25
          title: Page Size
        description: Tamaño de página, 1–100.
      - name: sort
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Orden: campo-asc o campo-desc.'
          title: Sort
        description: 'Orden: campo-asc o campo-desc.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Listar Admin V1 Access Grants Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/access-grants/{grant_id}:
    delete:
      tags:
      - Concesiones de acceso
      summary: Revocar una concesión de acceso
      description: 'Revoca una concesión antes de su vencimiento.


        Cerrar la propia concesión al terminar la investigación es la práctica

        esperada, no una excepción. Revocar una ajena exige rol de administración y

        motivo, y notifica al empleado afectado.'
      operationId: revocar_admin_v1_access_grants__grant_id__delete
      parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: string
          description: Concesión a revocar.
          title: Grant Id
        description: Concesión a revocar.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RevocarIn'
              - type: 'null'
              title: Cuerpo
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocarOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/business/overview:
    get:
      tags:
      - Consola de negocio
      summary: Panel general de negocio
      description: 'Indicadores agregados del negocio, con su frescura declarada.


        Ningún indicador de este endpoint identifica a un cliente concreto, así que no

        requiere concesión de acceso.'
      operationId: overview_admin_v1_business_overview_get
      parameters:
      - name: periodo
        in: query
        required: false
        schema:
          type: string
          description: mes_actual | mes_anterior | trimestre | ano.
          default: mes_actual
          title: Periodo
        description: mes_actual | mes_anterior | trimestre | ano.
      - name: comparar_con
        in: query
        required: false
        schema:
          type: string
          description: periodo_anterior | mismo_periodo_ano_anterior.
          default: periodo_anterior
          title: Comparar Con
        description: periodo_anterior | mismo_periodo_ano_anterior.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Overview Admin V1 Business Overview Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/business/customers:
    get:
      tags:
      - Consola de negocio
      summary: Listar clientes
      description: 'Listado de organizaciones con plan, estado, consumo y actividad.


        La búsqueda por razón social exige concesión vigente: permitirla sin ella

        convertiría el listado en un directorio de clientes consultable por cualquier

        empleado.'
      operationId: customers_admin_v1_business_customers_get
      parameters:
      - name: plan
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Plan
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: activa | periodo_gracia | suspendida | finalizada.
          title: Estado
        description: activa | periodo_gracia | suspendida | finalizada.
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Búsqueda por identificador. Por razón social exige concesión.
          title: Q
        description: Búsqueda por identificador. Por razón social exige concesión.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Página, empezando en 1.
          default: 1
          title: Page
        description: Página, empezando en 1.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Tamaño de página, 1–100.
          default: 25
          title: Page Size
        description: Tamaño de página, 1–100.
      - name: sort
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Orden: campo-asc o campo-desc.'
          title: Sort
        description: 'Orden: campo-asc o campo-desc.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Customers Admin V1 Business Customers Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/business/customers/{tenant_id}:
    get:
      tags:
      - Consola de negocio
      summary: Ficha de cliente
      description: 'Reúne todo lo que hay que saber de un cliente en una sola respuesta.


        Los bloques de identificación, usuarios e integraciones exigen concesión de

        alcance `datos_negocio` o superior; sin ella se devuelven enmascarados y la

        petición no falla. El bloque de grafo no incluye rutas de fichero ni nombres de

        símbolo: eso pertenece al alcance `contenido_codigo` y no se sirve aquí.'
      operationId: customer_admin_v1_business_customers__tenant_id__get
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          description: Organización a consultar.
          title: Tenant Id
        description: Organización a consultar.
      - name: incluir
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: usuarios, integraciones, historico, grafo.
          title: Incluir
        description: usuarios, integraciones, historico, grafo.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Customer Admin V1 Business Customers  Tenant Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/business/subscriptions:
    get:
      tags:
      - Consola de negocio
      summary: Suscripciones y renovaciones
      description: 'Suscripciones con su próxima renovación por aniversario de contratación.


        La consola es de solo lectura sobre este dominio: aprobar un cambio de plan o

        suspender una suscripción se hace desde el flujo comercial de §15.'
      operationId: subscriptions_admin_v1_business_subscriptions_get
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Estado
      - name: renueva_en_dias
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 90
            minimum: 1
          - type: 'null'
          title: Renueva En Dias
      - name: plan
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Plan
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Página, empezando en 1.
          default: 1
          title: Page
        description: Página, empezando en 1.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Tamaño de página, 1–100.
          default: 25
          title: Page Size
        description: Tamaño de página, 1–100.
      - name: sort
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Orden: campo-asc o campo-desc.'
          title: Sort
        description: 'Orden: campo-asc o campo-desc.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Subscriptions Admin V1 Business Subscriptions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/v1/business/upgrade-requests:
    get:
      tags:
      - Consola de negocio
      summary: Solicitudes de cambio de plan
      description: 'Cola de solicitudes de cambio de plan, ordenada por antigüedad.


        El orden por defecto es la solicitud más antigua primero: una solicitud

        olvidada es la peor de las respuestas posibles.'
      operationId: upgrade_requests_admin_v1_business_upgrade_requests_get
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: pendiente
          title: Estado
      - name: plan_deseado
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Plan Deseado
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Página, empezando en 1.
          default: 1
          title: Page
        description: Página, empezando en 1.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Tamaño de página, 1–100.
          default: 25
          title: Page Size
        description: Tamaño de página, 1–100.
      - name: sort
